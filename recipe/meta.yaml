{% set name = "pdfium" %}
{% set version = "7776" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_url: https://pdfium.googlesource.com/pdfium.git
  git_rev: chromium/{{ version }}
  git_depth: 1

build:
  number: 0
  skip: True  # [win]
  skip: True  # [linux and (s390x or ppc64le)]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - ninja
    - python >=3.8
    - curl
    - git

{% set headers = [
    "fpdf_annot.h",
    "fpdf_attachment.h",
    "fpdf_catalog.h",
    "fpdf_dataavail.h",
    "fpdf_doc.h",
    "fpdf_edit.h",
    "fpdf_ext.h",
    "fpdf_flatten.h",
    "fpdf_formfill.h",
    "fpdf_fwlevent.h",
    "fpdf_javascript.h",
    "fpdf_ppo.h",
    "fpdf_progressive.h",
    "fpdf_save.h",
    "fpdf_searchex.h",
    "fpdf_signature.h",
    "fpdf_structtree.h",
    "fpdf_sysfontinfo.h",
    "fpdf_text.h",
    "fpdf_thumbnail.h",
    "fpdf_transformpage.h",
    "fpdfview.h"
] %}

test:
  commands:
    - test -f $PREFIX/lib/libpdfium.dylib                  # [osx]
    - test -f $PREFIX/lib/libpdfium.so                     # [linux]
    {% for each_header in headers %}
    - test -f "${PREFIX}/include/{{ each_header }}"        # [unix]
    {% endfor %}

about:
  home: https://pdfium.googlesource.com/pdfium/
  summary: PDFium - PDF rendering library built from source
  description: |
    PDFium is an open-source PDF rendering library maintained by Google
    as part of the Chromium project. This package builds PDFium from source,
    providing the shared library and public headers for PDF manipulation
    and rendering. Built without V8 JavaScript engine or XFA forms support
    for a minimal, focused PDF rendering library.
  license: Apache-2.0 AND BSD-3-Clause
  license_family: Apache
  license_file: LICENSE
  doc_url: https://pdfium.googlesource.com/pdfium/+/refs/heads/main/docs/
  dev_url: https://pdfium.googlesource.com/pdfium/

extra:
  recipe-maintainers:
    - xkong-anaconda
